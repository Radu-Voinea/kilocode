# Fork-only release: builds the Linux x64 CLI and the JetBrains plugin with that CLI bundled,
# versioned as the upstream release plus a fourth number (7.8.27 -> 7.8.27.1, 7.8.27.2, ...),
# and attaches both to a GitHub Release on this repository. Publishes nothing to npm or the
# JetBrains Marketplace.
name: fork-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Full version, e.g. 7.8.27.3 (optional; default is the next free fourth number)"
        required: false
        type: string

permissions:
  contents: write

concurrency: fork-release

jobs:
  release:
    if: github.repository != 'Kilo-Org/kilocode'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - id: version
        name: Pick version
        run: |
          base=$(jq -r .version package.json)
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            last=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
              | sed -n "s/^v${base//./\\.}\.\([0-9]\+\)$/\1/p" | sort -n | tail -1)
            version="$base.$(( ${last:-0} + 1 ))"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must have four numbers, got $version"
            exit 1
          fi
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v$version already exists"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - uses: ./.github/actions/setup-bun

      - name: Setup Zig for Linux sandbox helpers
        run: |
          curl --fail --location --retry 3 \
            https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz \
            --output "$RUNNER_TEMP/zig.tar.xz"
          echo "473ec26806133cf4d1918caf1a410f8403a13d979726a9045b421b685031a982  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check --status
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-linux-x86_64-0.14.0" >> "$GITHUB_PATH"

      - name: Build CLI
        working-directory: packages/opencode
        run: bun run script/build.ts --single --skip-install
        env:
          KILO_VERSION: ${{ steps.version.outputs.version }}

      - name: Check CLI version
        run: |
          out=$(packages/opencode/dist/@kilocode/cli-linux-x64/bin/kilo --version)
          echo "$out"
          [[ "$out" == *"${{ steps.version.outputs.version }}"* ]]

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # kilo.cli.pinned=false bundles the CLI built above, so the plugin never downloads one from
      # Kilo-Org's releases.
      - name: Build JetBrains plugin
        working-directory: packages/kilo-jetbrains
        run: ./gradlew buildPlugin -Pkilo.cli.pinned=false -Pkilo.version="${{ steps.version.outputs.version }}"

      - name: Package
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p out
          tar -czf "out/kilo-linux-x64.tar.gz" -C packages/opencode/dist/@kilocode/cli-linux-x64/bin .
          mapfile -t zips < <(compgen -G "packages/kilo-jetbrains/build/distributions/*.zip")
          [ "${#zips[@]}" -eq 1 ] || { echo "::error::Expected one plugin zip, found ${#zips[@]}"; exit 1; }
          cp "${zips[0]}" "out/kilo-code-jetbrains-$version.zip"
          (cd out && sha256sum * > SHA256SUMS)
          ls -la out

      - name: Create release
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release create "v$version" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Kilo $version (fork)" \
            --notes "Fork build of Kilo on top of upstream $(jq -r .version package.json), commit $GITHUB_SHA. Linux x64 CLI and JetBrains plugin with that CLI bundled."
